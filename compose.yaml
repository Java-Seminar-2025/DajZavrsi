services:
  dajzavrsi:
    container_name: dajzavrsi
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"
    build:
      context: ./backend/
      dockerfile: docker/dajzavrsi-backend.Dockerfile

  dajzavrsi-frontend:
    container_name: dajzavrsi-frontend
    depends_on:
      mysql:
        condition: service_healthy
      dajzavrsi:
        condition: service_started
    ports:
      - "8080:80"
    build :
      context: ./frontend/
      dockerfile: docker/dajzavrsi-frontend.Dockerfile

  mysql:
    image: mysql:8.4
    container_name: dajzavrsi-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dajzavrsi
      MYSQL_USER: dajzavrsi
      MYSQL_PASSWORD: devpass

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: mysqladmin ping
      interval: 5s

volumes:
  mysql_data:
