spring.application.name=dajzavrsi

spring.datasource.url=jdbc:mysql://mysql:3306/dajzavrsi
spring.datasource.username=${DB_USERNAME:dajzavrsi}
spring.datasource.password=${DB_PASSWORD:devpass}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enable=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.table=flyway_schema_history

logging.level.org.flyway=DEBUG
